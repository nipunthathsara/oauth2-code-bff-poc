version: "3.9"

# ═══════════════════════════════════════════════════════════════
#  React OIDC + WSO2 Identity Server 7.2.0
#
#  Services:
#   1. wso2is       – Identity Server (auth backend)
#   2. wso2is-init  – One-shot init: creates OIDC app, writes client_id
#   3. react-app    – React SPA served by nginx
#
#  Startup order:
#   wso2is → (health check) → wso2is-init → react-app
# ═══════════════════════════════════════════════════════════════

services:

  # ─── WSO2 Identity Server ────────────────────────────────────
  wso2is:
    image: wso2/wso2is:7.2.0
    container_name: wso2is
    hostname: wso2is
    ports:
      - "9443:9443"   # HTTPS management console + OIDC endpoints
      - "9763:9763"   # HTTP (optional, usually not needed)
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    volumes:
      # Override deployment.toml with our custom config
      - ./wso2is/deployment.toml:/home/wso2carbon/wso2is-7.2.0/repository/conf/deployment.toml:ro
      # Persist WSO2 IS data (database, logs) across restarts
      - wso2is-data:/home/wso2carbon/wso2is-7.2.0/repository/database
      - wso2is-logs:/home/wso2carbon/wso2is-7.2.0/repository/logs
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "curl -sk https://localhost:9443/api/health-check/v1.0/health | grep -q '\"status\":\"UP\"'"
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s   # WSO2 IS takes ~2 min on first boot
    networks:
      - app-network

  # ─── Init container: create OIDC app in WSO2 IS ──────────────
  # wso2is-init:
  #   image: alpine/curl:latest
  #   container_name: wso2is-init
  #   depends_on:
  #     wso2is:
  #       condition: service_healthy
  #   volumes:
  #     - ./init-scripts/init-wso2is.sh:/init-wso2is.sh:ro
  #     - shared-config:/shared-config
  #   command: ["sh", "/init-wso2is.sh"]
  #   networks:
  #     - app-network
  #   restart: "no"

  # ─── React App (nginx) ────────────────────────────────────────
  react-app:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    container_name: react-app
    # depends_on:
    #   wso2is-init:
    #     condition: service_completed_successfully
    ports:
      - "80:80"       # Browse to http://localhost
    environment:
      - WSO2_BASE_URL=https://localhost:9443
    volumes:
      - shared-config:/shared-config:ro   # Read client_id written by init
    networks:
      - app-network

# ─── Named volumes ────────────────────────────────────────────────
volumes:
  wso2is-data:
    name: wso2is-data
  wso2is-logs:
    name: wso2is-logs
  shared-config:
    name: wso2-shared-config

# ─── Network ──────────────────────────────────────────────────────
networks:
  app-network:
    name: oidc-demo-network
    driver: bridge
