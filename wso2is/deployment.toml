[server]
hostname = "localhost"
base_path = "https://${carbon.local.ip}:${carbon.management.port}"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[user_store]
type = "database_unique_id"

[database.identity_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2IDENTITY_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
username = "wso2carbon"
password = "wso2carbon"

[database.shared_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
username = "wso2carbon"
password = "wso2carbon"

[keystore.primary]
file_name = "wso2carbon.jks"
password = "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
password = "wso2carbon"
type = "JKS"

# ── Self-Registration ────────────────────────────────────────────────────────
[identity_mgt.user_self_registration]
allow_self_registration = true
lock_on_creation = false
enable_recaptcha = false
send_confirmation_on_creation = false
send_security_notification_internally = false

# ── CORS ─────────────────────────────────────────────────────────────────────
[cors]
allow_generic_http_requests = true
allow_any_origin = false
allowed_origins = [
    "http://localhost",
    "http://localhost:80"
]
allowed_methods = ["DELETE", "GET", "HEAD", "OPTIONS", "PATCH", "POST", "PUT"]
allowed_headers = ["Accept", "Accept-Encoding", "Accept-Language", "Authorization",
    "Content-Type", "DNT", "If-Modified-Since", "Keep-Alive", "Origin",
    "User-Agent", "X-Requested-With"]
exposed_headers = ["X-OAuth-Scopes", "X-Accepted-OAuth-Scopes", "X-oAuthHeader"]
supports_credentials = true
max_age = 3600

# ── OAuth / OIDC ──────────────────────────────────────────────────────────────
[oauth.endpoints]
oauth2_consent_page = "${carbon.protocol}://localhost:${carbon.management.port}/authenticationendpoint/oauth2_authz.do"
oauth2_error_page = "${carbon.protocol}://localhost:${carbon.management.port}/authenticationendpoint/oauth2_error.do"
oidc_consent_page = "${carbon.protocol}://localhost:${carbon.management.port}/authenticationendpoint/oauth2_authz.do"
oidc_logout_consent_page = "${carbon.protocol}://localhost:${carbon.management.port}/authenticationendpoint/oauth2_logout_consent.do"
oidc_logout_page = "${carbon.protocol}://localhost:${carbon.management.port}/authenticationendpoint/oauth2_logout.do"

[oauth.token_validation]
include_validation_context_as_jwt_in_reponse = true

[authentication.adaptive]
enable_script_based_adaptive_authentication = false

[account_management.password_reset]
enable_admin_password_reset_with_otp = false
